<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우마무스메 미래시</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#fafaf8;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e8e6df;padding:0 24px;position:sticky;top:0;z-index:50}
.header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.container{max-width:960px;margin:0 auto;padding:24px}
.tabs{display:flex;margin-bottom:24px;border-bottom:1.5px solid #e8e6df}
.tab{font-size:14px;font-weight:500;padding:10px 20px;cursor:pointer;color:#888;background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;font-family:'Noto Sans KR',sans-serif;transition:color 0.15s,border-color 0.15s}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.tab:hover{color:#444}
.section{display:none}.section.active{display:block}
.data-info{font-size:12px;color:#aaa;margin-bottom:18px;padding:10px 14px;background:#fff;border:1px solid #e8e6df;border-radius:8px}
.pickup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.pickup-card{background:#fff;border:1px solid #e8e6df;border-radius:12px;overflow:hidden;transition:box-shadow 0.15s}
.pickup-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.07)}
.pickup-card.gacha-yes{border-color:#f4c0d1}
.pickup-img{width:100%;height:150px;background:#f3f1ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#bbb;font-size:12px}
.pickup-body{padding:12px 14px}
.status-badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;margin-bottom:6px}
.s-active{background:#e6f5ec;color:#1a7a45}
.s-upcoming{background:#fef4e4;color:#8a5c10}
.s-ended{background:#f0efea;color:#888}
.pickup-name{font-size:14px;font-weight:700;margin-bottom:3px;line-height:1.4}
.pickup-period{font-size:11px;color:#999;margin-bottom:4px}
.pickup-kind{font-size:11px;color:#666}
.gacha-tag{display:inline-block;font-size:10px;background:#fff5f8;color:#993556;border:1px solid #f4c0d1;padding:2px 7px;border-radius:10px;font-weight:500;margin-bottom:4px}
.jewel-total-bar{background:#1a1a1a;border-radius:10px;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:16px}
.jewel-total-label{font-size:13px;opacity:0.7}
.jewel-total-right{text-align:right}
.jewel-total-num{font-size:28px;font-weight:700}
.jewel-gacha-eq{font-size:12px;opacity:0.6;margin-top:2px}
.jewel-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.jewel-cat-card{background:#fff;border:1px solid #e8e6df;border-radius:10px;padding:14px;text-align:center}
.jewel-cat-num{font-size:20px;font-weight:700}
.jewel-cat-label{font-size:11px;color:#888;margin-top:3px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#555;transition:all 0.12s}
.filter-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.jewel-list-section{background:#fff;border:1px solid #e8e6df;border-radius:12px;overflow:hidden;margin-bottom:16px}
.jewel-list-header{padding:12px 16px;background:#fafaf8;border-bottom:1px solid #e8e6df;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.jewel-list-body{max-height:340px;overflow-y:auto}
.jewel-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #f0efea;gap:12px}
.jewel-row:last-child{border-bottom:none}
.jewel-row-date{font-size:11px;color:#999;min-width:76px}
.jewel-row-name{font-size:13px;flex:1;line-height:1.4}
.jewel-row-cat{font-size:10px;color:#888;background:#f3f1ea;padding:2px 7px;border-radius:10px;white-space:nowrap}
.jewel-row-amount{font-size:14px;font-weight:700;min-width:60px;text-align:right}
.pvp-card{background:#fff;border:1px solid #e8e6df;border-radius:12px;padding:18px;margin-bottom:14px}
.pvp-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.pvp-name{font-size:16px;font-weight:700}
.pvp-period{font-size:12px;color:#888;margin-top:3px}
.pvp-badge{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pvp-live{background:#e6f5ec;color:#1a7a45}
.pvp-upcoming{background:#fef4e4;color:#8a5c10}
.pvp-ended{background:#f0efea;color:#888}
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.07em;margin:12px 0 7px}
.tier-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tier-pill{font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px}
.tier-s{background:#fff0ed;color:#c03a1d;border:1px solid #f5c4b3}
.tier-a{background:#fff8ed;color:#8a5c10;border:1px solid #fad9a0}
.tier-b{background:#f0f7ff;color:#1a5c99;border:1px solid #b5d4f4}
.support-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.support-slot{background:#fafaf8;border:1px solid #e8e6df;border-radius:8px;padding:10px;text-align:center}
.support-slot.rental{border-color:#f4c0d1;background:#fff5f8}
.support-slot-num{font-size:10px;color:#bbb;margin-bottom:4px}
.support-slot-name{font-size:12px;font-weight:500;color:#1a1a1a;line-height:1.3}
.rental-tag{display:inline-block;font-size:9px;background:#f4c0d1;color:#993556;padding:1px 5px;border-radius:3px;font-weight:700;margin-bottom:4px}
.add-btn{width:100%;padding:12px;border:1.5px dashed #d0cec7;border-radius:10px;background:none;color:#aaa;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;margin-top:4px}
.add-btn:hover{background:#fff;color:#555;border-color:#aaa}
.empty-msg{text-align:center;padding:28px;color:#bbb;font-size:14px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:12px}
.form-label{font-size:12px;font-weight:500;color:#666;margin-bottom:4px;display:block}
.form-row{display:flex;gap:10px}.form-row>div{flex:1}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:'Noto Sans KR',sans-serif;color:#1a1a1a;background:#fff;outline:none;transition:border-color 0.15s}
input:focus,textarea:focus{border-color:#888}
textarea{resize:vertical;min-height:68px;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-primary{padding:10px 20px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.btn-primary:hover{background:#333}
.btn-cancel{padding:10px 20px;background:none;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#666;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.btn-cancel:hover{background:#f5f5f5}
.support-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rental-input{border-color:#f4c0d1!important}
.img-upload-area{width:100%;height:120px;background:#f7f6f2;border:1.5px dashed #d0cec7;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#bbb;font-size:12px;cursor:pointer;position:relative;overflow:hidden}
.img-upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-upload-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-upload-area:hover{background:#f0ede7}
.footer{text-align:center;padding:28px 24px;color:#ccc;font-size:12px}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">🏇 우마무스메 미래시</div>
    <div style="font-size:12px;color:#aaa">픽업 · 쥬얼 · PVP</div>
  </div>
</header>

<main class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('pickup',this)">🎯 픽업 이벤트</button>
    <button class="tab" onclick="showTab('jewel',this)">💎 쥬얼 계산</button>
    <button class="tab" onclick="showTab('pvp',this)">⚔️ PVP 이벤트</button>
  </div>

  <!-- 픽업 탭 -->
  <div id="tab-pickup" class="section active">
    <div class="data-info">📊 엑셀 데이터 기준 · 2026.05.31 업데이트 · 픽업 27개</div>
    <div class="pickup-grid" id="pickup-grid"></div>
    <button class="add-btn" onclick="openModal('modal-pickup')">+ 픽업 직접 추가</button>
  </div>

  <!-- 쥬얼 탭 -->
  <div id="tab-jewel" class="section">
    <div class="data-info">📊 엑셀 데이터 기준 · 오늘 이후 수급 예정 쥬얼 표시</div>
    <div class="jewel-total-bar">
      <div class="jewel-total-label">총 예상 쥬얼 (오늘 이후)</div>
      <div class="jewel-total-right">
        <div class="jewel-total-num" id="jewel-total">0</div>
        <div class="jewel-gacha-eq" id="jewel-gacha">= 0회 뽑기</div>
      </div>
    </div>
    <div class="jewel-summary" id="jewel-summary"></div>
    <div class="filter-row" id="jewel-filters"></div>
    <div class="jewel-list-section">
      <div class="jewel-list-header">
        <span>항목 목록</span>
        <span id="jewel-count" style="font-size:12px;color:#aaa;font-weight:400"></span>
      </div>
      <div class="jewel-list-body" id="jewel-list"></div>
    </div>
    <button class="add-btn" onclick="openModal('modal-jewel')">+ 쥬얼 직접 추가</button>
  </div>

  <!-- PVP 탭 -->
  <div id="tab-pvp" class="section">
    <div id="pvp-list"></div>
    <div id="pvp-empty" class="empty-msg">PVP 이벤트를 추가해 보세요!</div>
    <button class="add-btn" onclick="openModal('modal-pvp')">+ PVP 이벤트 추가</button>
  </div>
</main>

<!-- 픽업 모달 -->
<div class="modal-overlay" id="modal-pickup">
  <div class="modal">
    <div class="modal-title">🎯 픽업 추가</div>
    <div class="form-group">
      <label class="form-label">이미지</label>
      <div class="img-upload-area" id="p-img-area">
        <div style="font-size:24px">📷</div><span>클릭하여 이미지 선택</span>
        <input type="file" accept="image/*" onchange="previewImg(this)">
        <img id="p-img-area-img" style="display:none">
      </div>
      <input type="hidden" id="p-img-data">
    </div>
    <div class="form-group"><label class="form-label">캐릭터 이름 *</label><input type="text" id="p-name" placeholder="예: 스페셜 위크"></div>
    <div class="form-group"><label class="form-label">종류</label>
      <select id="p-kind"><option>말딸</option><option>서폿</option><option>말딸+서폿</option></select>
    </div>
    <div class="form-group">
      <div class="form-row">
        <div><label class="form-label">시작일 *</label><input type="date" id="p-start"></div>
        <div><label class="form-label">종료일 *</label><input type="date" id="p-end"></div>
      </div>
    </div>
    <div class="form-group"><label class="form-label">가챠 예정</label>
      <select id="p-gacha"><option value="0">아니오</option><option value="1">예</option></select>
    </div>
    <div class="form-group"><label class="form-label">설명</label><textarea id="p-desc" placeholder="특징, 추천 이유 등"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-pickup')">취소</button>
      <button class="btn-primary" onclick="addPickup()">추가하기</button>
    </div>
  </div>
</div>

<!-- 쥬얼 모달 -->
<div class="modal-overlay" id="modal-jewel">
  <div class="modal">
    <div class="modal-title">💎 쥬얼 추가</div>
    <div class="form-group"><label class="form-label">이름 *</label><input type="text" id="j-name" placeholder="예: 로그인 보너스"></div>
    <div class="form-group"><label class="form-label">쥬얼 수량 *</label><input type="number" id="j-amount" placeholder="예: 3000" min="0"></div>
    <div class="form-group"><label class="form-label">카테고리</label>
      <select id="j-cat"><option>기타</option><option>이벤트</option><option>챔미</option><option>말오스</option><option>시나리오, 로그인</option><option>레전드 레이스</option></select>
    </div>
    <div class="form-group"><label class="form-label">날짜</label><input type="date" id="j-date"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-jewel')">취소</button>
      <button class="btn-primary" onclick="addJewelManual()">추가하기</button>
    </div>
  </div>
</div>

<!-- PVP 모달 -->
<div class="modal-overlay" id="modal-pvp">
  <div class="modal">
    <div class="modal-title">⚔️ PVP 이벤트 추가</div>
    <div class="form-group"><label class="form-label">이벤트명 *</label><input type="text" id="v-name" placeholder="예: 챔피언스 미팅 봄"></div>
    <div class="form-group">
      <div class="form-row">
        <div><label class="form-label">시작일 *</label><input type="date" id="v-start"></div>
        <div><label class="form-label">종료일 *</label><input type="date" id="v-end"></div>
      </div>
    </div>
    <div class="form-group"><label class="form-label">S티어 (쉼표 구분)</label><input type="text" id="v-tier-s" placeholder="예: 골드십, 에어샤카르"></div>
    <div class="form-group"><label class="form-label">A티어 (쉼표 구분)</label><input type="text" id="v-tier-a" placeholder="예: 나이스네이처"></div>
    <div class="form-group"><label class="form-label">B티어 (쉼표 구분)</label><input type="text" id="v-tier-b"></div>
    <div class="form-group"><label class="form-label">서포터 편성 (슬롯1~5 + 렌탈)</label>
      <div class="support-inputs">
        <input type="text" placeholder="슬롯 1" id="s1">
        <input type="text" placeholder="슬롯 2" id="s2">
        <input type="text" placeholder="슬롯 3" id="s3">
        <input type="text" placeholder="슬롯 4" id="s4">
        <input type="text" placeholder="슬롯 5" id="s5">
        <input type="text" placeholder="🔗 렌탈 (슬롯6)" id="s6" class="rental-input">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-pvp')">취소</button>
      <button class="btn-primary" onclick="addPvp()">추가하기</button>
    </div>
  </div>
</div>

<footer class="footer">우마무스메 미래시 관리 사이트 · 엑셀 내장 데이터 (2026.05.31 기준)</footer>

// ── localStorage: 직접 추가분만 저장 ─────────
let extraPickups = JSON.parse(localStorage.getItem('uma_extra_pickups')||'[]');
let extraJewels  = JSON.parse(localStorage.getItem('uma_extra_jewels')||'[]');
let pvps         = JSON.parse(localStorage.getItem('uma_pvps')||'[]');

let pickups = [...EXCEL_PICKUPS, ...extraPickups];
let jewels  = [...EXCEL_JEWELS,  ...extraJewels];
let activeFilter = 'all';

function saveExtra(){
  localStorage.setItem('uma_extra_pickups', JSON.stringify(extraPickups));
  localStorage.setItem('uma_extra_jewels',  JSON.stringify(extraJewels));
  localStorage.setItem('uma_pvps',          JSON.stringify(pvps));
}

function showTab(t,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));

function getStatus(s,e){const n=new Date(),a=new Date(s),b=new Date(e);if(n<a)return'upcoming';if(n>b)return'ended';return'active'}
function statusText(s){return{active:'진행 중',upcoming:'예정',ended:'종료'}[s]}
function daysLeft(e){return Math.max(0,Math.ceil((new Date(e)-new Date())/86400000))}

function previewImg(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const area=document.getElementById('p-img-area');
    area.querySelector('span').style.display='none';
    area.querySelector('div').style.display='none';
    const img=area.querySelector('img');img.src=e.target.result;img.style.display='block';
    document.getElementById('p-img-data').value=e.target.result;
  };reader.readAsDataURL(file);
}

// ── 픽업 ──────────────────────────────────────
function addPickup(){
  const name=document.getElementById('p-name').value.trim();
  const start=document.getElementById('p-start').value;
  const end=document.getElementById('p-end').value;
  if(!name||!start||!end){alert('이름과 기간을 입력해 주세요');return}
  extraPickups.push({name,kind:document.getElementById('p-kind').value,
    gacha:document.getElementById('p-gacha').value==='1',
    start,end,desc:document.getElementById('p-desc').value.trim(),
    img:document.getElementById('p-img-data').value});
  pickups=[...EXCEL_PICKUPS,...extraPickups];
  saveExtra();renderPickups();closeModal('modal-pickup');
  ['p-name','p-start','p-end','p-desc','p-img-data'].forEach(id=>document.getElementById(id).value='');
  const a=document.getElementById('p-img-area');
  a.querySelector('span').style.display='';a.querySelector('div').style.display='';
  a.querySelector('img').style.display='none';a.querySelector('img').src='';
}

function removePickup(i,isExtra){
  if(isExtra){extraPickups.splice(i,1);pickups=[...EXCEL_PICKUPS,...extraPickups];saveExtra();}
  else{EXCEL_PICKUPS.splice(i,1);pickups=[...EXCEL_PICKUPS,...extraPickups];}
  renderPickups();
}

function renderPickups(){
  const g=document.getElementById('pickup-grid');
  const sorted=pickups.map((p,i)=>{
    const isExtra=i>=EXCEL_PICKUPS.length;
    return{...p,_i:isExtra?i-EXCEL_PICKUPS.length:i,_extra:isExtra};
  }).sort((a,b)=>a.start.localeCompare(b.start));
  g.innerHTML=sorted.map(p=>{
    const st=getStatus(p.start,p.end);
    const sc={active:'s-active',upcoming:'s-upcoming',ended:'s-ended'}[st];
    const dl=daysLeft(p.end);
    const imgH=p.img
      ?`<div class="pickup-img"><img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover"></div>`
      :'<div class="pickup-img"><span style="font-size:26px">📷</span><span>이미지 없음</span></div>';
    return`<div class="pickup-card${p.gacha?' gacha-yes':''}">
      ${imgH}
      <div class="pickup-body">
        <span class="status-badge ${sc}">${statusText(st)}${st==='active'?' · D-'+dl:''}</span>
        ${p.gacha?'<div><span class="gacha-tag">🎯 뽑을 예정</span></div>':''}
        <div class="pickup-name">${p.name}</div>
        <div class="pickup-period">📅 ${p.start.replace(/-/g,'.')} ~ ${p.end.replace(/-/g,'.')}</div>
        <div class="pickup-kind">${p.kind||''}</div>
        ${p.desc?`<div style="font-size:12px;color:#666;margin-top:5px;line-height:1.5">${p.desc}</div>`:''}
        <button onclick="removePickup(${p._i},${p._extra})" style="font-size:11px;color:#ccc;background:none;border:none;cursor:pointer;margin-top:8px;font-family:'Noto Sans KR',sans-serif">✕ 삭제</button>
      </div>
    </div>`;
  }).join('');
}

// ── 쥬얼 ──────────────────────────────────────
function addJewelManual(){
  const name=document.getElementById('j-name').value.trim();
  const amount=parseInt(document.getElementById('j-amount').value)||0;
  const date=document.getElementById('j-date').value||new Date().toISOString().split('T')[0];
  if(!name||!amount){alert('이름과 수량을 입력해 주세요');return}
  extraJewels.push({name,amount,date,category:document.getElementById('j-cat').value});
  jewels=[...EXCEL_JEWELS,...extraJewels];
  saveExtra();renderJewels();closeModal('modal-jewel');
  ['j-name','j-amount','j-date'].forEach(id=>document.getElementById(id).value='');
}

function setFilter(cat){activeFilter=cat;renderJewels()}

function renderJewels(){
  const today=new Date().toISOString().split('T')[0];
  const future=jewels.filter(j=>j.date>=today);
  const filtered=activeFilter==='all'?future:future.filter(j=>j.category===activeFilter);
  const total=future.reduce((a,j)=>a+j.amount,0);
  document.getElementById('jewel-total').textContent=total.toLocaleString();
  document.getElementById('jewel-gacha').textContent=`= ${Math.floor(total/150).toLocaleString()}회 뽑기 (150쥬얼/회)`;
  const cats={};
  future.forEach(j=>{cats[j.category]=(cats[j.category]||0)+j.amount});
  document.getElementById('jewel-summary').innerHTML=
    Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      `<div class="jewel-cat-card"><div class="jewel-cat-num">${v.toLocaleString()}</div><div class="jewel-cat-label">${k}</div></div>`
    ).join('');
  document.getElementById('jewel-filters').innerHTML=
    ['all',...Object.keys(cats)].map(c=>
      `<button class="filter-btn${activeFilter===c?' active':''}" onclick="setFilter('${c}')">${c==='all'?'전체':c}</button>`
    ).join('');
  const sorted=filtered.slice().sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('jewel-count').textContent=sorted.length+'개';
  document.getElementById('jewel-list').innerHTML=sorted.map(j=>
    `<div class="jewel-row">
      <span class="jewel-row-date">${j.date.replace(/-/g,'.')}</span>
      <span class="jewel-row-name">${j.name}</span>
      <span class="jewel-row-cat">${j.category||'기타'}</span>
      <span class="jewel-row-amount">+${j.amount.toLocaleString()}</span>
    </div>`
  ).join('');
}

// ── PVP ───────────────────────────────────────
function addPvp(){
  const name=document.getElementById('v-name').value.trim();
  const start=document.getElementById('v-start').value;
  const end=document.getElementById('v-end').value;
  if(!name||!start||!end){alert('이름과 기간을 입력해 주세요');return}
  pvps.push({name,start,end,
    tierS:document.getElementById('v-tier-s').value.trim(),
    tierA:document.getElementById('v-tier-a').value.trim(),
    tierB:document.getElementById('v-tier-b').value.trim(),
    supports:['s1','s2','s3','s4','s5','s6'].map(id=>document.getElementById(id).value.trim())
  });
  saveExtra();renderPvps();closeModal('modal-pvp');
  ['v-name','v-start','v-end','v-tier-s','v-tier-a','v-tier-b','s1','s2','s3','s4','s5','s6'].forEach(id=>document.getElementById(id).value='');
}

function removePvp(i){pvps.splice(i,1);saveExtra();renderPvps()}

function renderPvps(){
  const el=document.getElementById('pvp-list');
  const empty=document.getElementById('pvp-empty');
  if(pvps.length===0){el.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  el.innerHTML=pvps.map((p,i)=>{
    const st=getStatus(p.start,p.end);
    const bc={active:'pvp-live',upcoming:'pvp-upcoming',ended:'pvp-ended'}[st];
    const dl=daysLeft(p.end);
    const pills=(arr,cls,prefix)=>(arr||'').split(',').filter(x=>x.trim()).map(c=>`<span class="tier-pill ${cls}">${prefix} ${c.trim()}</span>`).join('');
    const slots=p.supports.map((s,idx)=>{
      const r=idx===5;
      return`<div class="support-slot${r?' rental':''}">
        ${r?'<div class="rental-tag">렌탈</div>':''}
        <div class="support-slot-num">슬롯 ${idx+1}</div>
        <div class="support-slot-name">${s||'—'}</div>
      </div>`;
    }).join('');
    const tierHTML=pills(p.tierS,'tier-s','S')+pills(p.tierA,'tier-a','A')+pills(p.tierB,'tier-b','B');
    return`<div class="pvp-card">
      <div class="pvp-header">
        <div><div class="pvp-name">${p.name}</div>
        <div class="pvp-period">📅 ${p.start.replace(/-/g,'.')} ~ ${p.end.replace(/-/g,'.')}${st==='active'?' · D-'+dl:''}</div></div>
        <span class="pvp-badge ${bc}">${statusText(st)}</span>
      </div>
      ${tierHTML?`<div class="section-label">티어 픽</div><div class="tier-row">${tierHTML}</div>`:''}
      <div class="section-label">서포터 편성</div>
      <div class="support-grid">${slots}</div>
      <button onclick="removePvp(${i})" style="font-size:11px;color:#ccc;background:none;border:none;cursor:pointer;margin-top:10px;font-family:'Noto Sans KR',sans-serif">✕ 삭제</button>
    </div>`;
  }).join('');
}

renderPickups();renderJewels();renderPvps();
</script>
</body>
</html>
